<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Montar time | PokéTeams</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/pokemon.css}"></head>
<body><main class="container py-5 form-page"><a href="/times" class="back">← Voltar para meus times</a><div class="form-header"><p class="eyebrow">POKÉTEAMS</p><h1 th:text="${time != null ? 'Editar time' : 'Montar novo time'}"></h1><p class="text-secondary">Escolha seus Pokémon no catálogo oficial da PokéAPI.</p></div>
<form th:object="${timeForm}" th:action="${acao}" method="post" class="team-form"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="error : ${#fields.globalErrors()}"><span th:text="${error}"></span></div><div class="row g-3"><div class="col-md-6"><label>Nome do time *</label><input th:field="*{nome}" class="form-control" placeholder="Ex.: Os campeões" required></div><div class="col-md-6"><label>Treinador *</label><input th:field="*{treinador}" class="form-control" placeholder="Seu nome" required></div><div class="col-md-6"><label>Região</label><input th:field="*{regiao}" class="form-control" placeholder="Ex.: Kanto"></div></div><hr><div class="d-flex justify-content-between align-items-center"><div><h3>Escolha os Pokémon</h3><p class="text-secondary small mb-0">Pesquise no catálogo e clique em “Adicionar ao time”. Máximo de 6.</p></div><span class="count" id="team-count">0/6</span></div><input id="pokemon-search" class="form-control catalog-search" placeholder="🔎 Pesquisar por nome ou número..." autocomplete="off"><div id="catalog-status" class="text-secondary small py-3">Carregando catálogo da PokéAPI...</div><div id="pokemon-catalog" class="catalog-grid"></div><div class="selected-heading"><h3>Meu time</h3><span class="text-secondary small">Defina o nível de cada Pokémon</span></div><div id="pokemon-list"><div class="pokemon-row" th:each="pokemon, stat : *{pokemons}"><span class="slot" th:text="${stat.index + 1}"></span><input th:name="${'pokemons[' + stat.index + '].nome'}" th:value="${pokemon.nome}" class="form-control pokemon-name" placeholder="Nome do Pokémon" required><input th:name="${'pokemons[' + stat.index + '].nivel'}" th:value="${pokemon.nivel}" type="number" min="1" max="100" class="form-control level" required><button type="button" class="remove btn btn-link" title="Remover">×</button></div></div><div class="form-actions"><a href="/times" class="btn btn-light">Cancelar</a><button class="btn btn-pokemon" type="submit">Salvar time</button></div></form></main>
<script>const list=document.querySelector('#pokemon-list'),catalog=document.querySelector('#pokemon-catalog'),search=document.querySelector('#pokemon-search'),status=document.querySelector('#catalog-status'),count=document.querySelector('#team-count');let allPokemon=[];function refresh(){[...list.children].forEach((row,i)=>{row.querySelector('.slot').textContent=i+1;row.querySelector('input.pokemon-name').name=`pokemons[${i}].nome`;row.querySelector('input.level').name=`pokemons[${i}].nivel`;row.querySelector('.remove').style.visibility=list.children.length>1?'visible':'hidden';});count.textContent=`${list.children.length}/6`;}function addPokemon(name){if(list.children.length>=6){alert('Um time pode ter no máximo 6 Pokémon.');return;}if([...list.querySelectorAll('.pokemon-name')].some(input=>input.value.toLowerCase()===name.toLowerCase()))return;const row=document.createElement('div');row.className='pokemon-row';row.innerHTML=`<span class="slot"></span><input name="pokemons[0].nome" value="${name}" class="form-control pokemon-name" required><input name="pokemons[0].nivel" type="number" min="1" max="100" value="50" class="form-control level" required><button type="button" class="remove btn btn-link" title="Remover">×</button>`;list.appendChild(row);refresh();}function renderCatalog(){const term=search.value.toLowerCase().trim(),items=allPokemon.filter(p=>p.nome.includes(term)||String(p.id)===term).slice(0,80);catalog.innerHTML=items.map(p=>`<article class="catalog-card"><img src="${p.imagem}" alt="${p.nome}"><div><strong>#${String(p.id).padStart(4,'0')}</strong><span>${p.nome}</span></div><button type="button" class="btn btn-sm btn-outline-dark add-pokemon" data-name="${p.nome}">Adicionar</button></article>`).join('');status.textContent=term?`${items.length} Pokémon encontrados (mostrando até 80).`:`${allPokemon.length} Pokémon disponíveis.`;}catalog.addEventListener('click',e=>{const button=e.target.closest('.add-pokemon');if(button)addPokemon(button.dataset.name);});search.addEventListener('input',renderCatalog);list.addEventListener('click',e=>{if(e.target.classList.contains('remove')){e.target.parentElement.remove();refresh();}});fetch('/api/pokemons').then(r=>{if(!r.ok)throw new Error();return r.json();}).then(data=>{allPokemon=data;renderCatalog();}).catch(()=>{status.textContent='Não foi possível carregar a PokéAPI. Tente atualizar a página.';});refresh();</script></body></html>
